services:
  web:
    build: .
    image: reachability-audit:latest
    environment:
      PORT: "8080"
    ports:
      # Host port is configurable:  HOST_PORT=9090 docker compose up web
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8080')+'/healthz',timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    image: reachability-audit:latest
    build: .
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_URL: "http://web:8080"
    # Runs unit tests, build checks and the API/HTTP smoke suite, then
    # exits.  Inspect the outcome with:
    #   docker compose up --exit-code-from verify --abort-on-container-exit
    command: ["python", "-m", "verify.verify"]
